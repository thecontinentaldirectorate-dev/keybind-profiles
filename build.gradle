plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The jar carries the game version in its file name so the download is self describing, but
// fabric.mod.json keeps the plain mod version. Sticking the game version in there too would
// make loader read "26.2" as a semver prerelease tag and sort 1.0.0-26.2 below 1.0.0.
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.mod_version}-${project.minecraft_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Loader on its own does not show a mod's assets folder to the resource manager, so without
	// this the lang file is never read and every button renders its translation key instead.
	// Bundled rather than depended on, since one module is a lot to ask people to install the
	// whole of Fabric API for.
	implementation include(fabricApi.module('fabric-resource-loader-v0', project.fabric_version))
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
